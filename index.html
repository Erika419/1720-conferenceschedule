        <main>
            <h1>1720 Hire Me Assignment</h1> 
            <form action="results.html" method="get">
                <label> First Name:
                    <input type="text" name="first" required autocomplete="given-name" placeholder="First Name">
                </label>

                <label> Last Name:
                <input type="text" name="last" required autocomplete="family-name" placeholder="Last Name">
                </label>

                <label> Telephone Number:
                <input type="tel" name="telephone" required autocomplete="tel" placeholder="XXX-XXX-XXXX">
                </label>

                <label> Email:
                <input type="email" name="Email" required autocomplete="email" placeholder="Zen@gmail.com">
                </label>

                <label> Portfolio URL:
                <input type="url" name="portfolio" required autocomplete="url" placeholder="https://example.com">
                </label>

                <label> Applying as:
                    <select name="who" required>
                    <option value="Master">Master Designer</option>
                    <option value="Apprentice">Apprentice Designer</option>
                    <option value="Student">Student Designer</option>
                    <option value="Employer">Employer </option>
                    </select>
                </label>

                <label>
                    <textarea name="comments" rows="5" placeholder="Enter your comments..."></textarea>
                </label>
                <input type="submit" value="Apply Now">

            </form>
